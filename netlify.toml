[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/detect"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/detect/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
